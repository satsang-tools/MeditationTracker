<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF8A2E" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#FF8A2E" stop-opacity="0.14"/>
      <stop offset="82%" stop-color="#FF8A2E" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFE0B0"/>
      <stop offset="45%" stop-color="#FF8A2E"/>
      <stop offset="100%" stop-color="#E0631C"/>
    </radialGradient>
  </defs>

  <!-- dark blue background -->
  <rect width="512" height="512" fill="#1A1A40"/>

  <!-- the warm light the flame throws -->
