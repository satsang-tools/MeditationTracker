<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#E6A24C" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#E6A24C" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#E6A24C" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FDE8C6"/>
      <stop offset="45%" stop-color="#E6A24C"/>
      <stop offset="100%" stop-color="#B07C39"/>
    </radialGradient>
  </defs>

  <!-- the dark room -->
  <rect width="512" height="512" fill="#15120D"/>

  <!-- the warm light it throws -->
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- the breathing ring, echoing the app's control -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#E6A24C" stroke-opacity="0.35" stroke-width="4"/>

  <!-- the single flame -->
  <path d="M256 150
           C 300 198, 318 232, 318 274
           C 318 320, 290 352, 256 352
           C 222 352, 194 320, 194 274
           C 194 232, 212 198, 256 150 Z"
        fill="url(#flame)"/>
  <!-- inner core -->
  <path d="M256 232
           C 274 254, 282 272, 282 292
           C 282 314, 271 330, 256 330
           C 241 330, 230 314, 230 292
           C 230 272, 238 254, 256 232 Z"
        fill="#FDE8C6" fill-opacity="0.85"/>
</svg>
