<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#3A93FF"/>
      <stop offset="100%" stop-color="#1464DC"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#FF8A2E" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FF8A2E" stop-opacity="0.16"/>
      <stop offset="82%" stop-color="#FF8A2E" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFE0B0"/>
      <stop offset="45%" stop-color="#FF8A2E"/>
      <stop offset="100%" stop-color="#E0631C"/>
    </radialGradient>
  </defs>

  <!-- the blue room -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- the warm light the flame throws -->
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- the single orange flame -->
  <path d="M256 150
           C 300 198, 318 232, 318 274
           C 318 320, 290 352, 256 352
           C 222 352, 194 320, 194 274
           C 194 232, 212 198, 256 150 Z"
        fill="url(#flame)"/>
  <!-- inner core -->
  <path d="M256 232
           C 274 254, 282 272, 282 292
           C 282 314, 271 330, 256 330
           C 241 330, 230 314, 230 292
           C 230 272, 238 254, 256 232 Z"
        fill="#FFE9C8" fill-opacity="0.9"/>
</svg>
