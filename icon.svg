<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E86FF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#2E86FF" stop-opacity="0.14"/>
      <stop offset="72%" stop-color="#2E86FF" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- the dark room at night -->
  <rect width="512" height="512" fill="#0B0D11"/>

  <!-- the cool light it throws -->
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- the breathing ring, echoing the app's control: blurred glow ... -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2E86FF"
          stroke-width="11" filter="url(#soft)" opacity="0.85"/>
  <!-- ... and the crisp electric edge -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#5AA8FF" stroke-width="5"/>
</svg>
