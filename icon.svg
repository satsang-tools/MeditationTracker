    <path d="M256 150
             C 300 198, 318 232, 318 274
             C 318 320, 290 352, 256 352
             C 222 352, 194 320, 194 274
             C 194 232, 212 198, 256 150 Z"
          fill="url(#flame)"/>
    <path d="M256 232
             C 274 254, 282 272, 282 292
             C 282 314, 271 330, 256 330
             C 241 330, 230 314, 230 292
             C 230 272, 238 254, 256 232 Z"
          fill="#FFE9C8" fill-opacity="0.9"/>
  </g>
</svg>
