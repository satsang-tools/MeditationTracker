<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sitting">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Sitting</title>
<style>
  :root{
    --bg:#0B0D11;          /* cool near-black: a dark room at night */
    --bg2:#12151B;
    --ink:#EFE6D4;         /* warm cream: the lit label */
    --muted:#7C766B;       /* quiet headers / day captions */
    --faint:#646B78;       /* gridlines + right-edge ticks (more visible) */
    --grid-base:#767E8B;
    --blue:#2E86FF;        /* the single electric current */
    --blue-soft:#5AA8FF;
    --blue-dim:rgba(90,150,255,0.55);
    --area-top:rgba(46,134,255,0.26);
    --area-bot:rgba(46,134,255,0.0);
    --glow:rgba(46,134,255,0.55);
    --glow-strong:rgba(70,150,255,0.85);
    --orange:#FF8A2E;      /* Finish state — complement of --blue, equal intensity */
    --glow-orange:rgba(255,138,46,0.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
  }
  .app{
    max-width:440px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:max(10px, env(safe-area-inset-top)) 20px max(12px, env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 55% at 50% 112%, rgba(46,134,255,0.06), transparent 70%),
      var(--bg);
  }

  /* ---- chart (the hero): fills the top two-thirds of the screen ---- */
  .chart-wrap{
    flex:0 0 66.667%;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding-top:6px;
  }
  .chart-head{
    flex:0 0 auto;
    display:flex; justify-content:space-between; align-items:baseline;
    padding:0 4px 10px;
  }
  .head-label{
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted);
  }
  svg.chart{flex:1 1 auto; width:100%; height:100%; min-height:0; display:block; overflow:visible;}
  .grid-line{stroke:var(--faint); stroke-width:1;}
  .grid-base{stroke:var(--grid-base); stroke-width:1.25;}
  .tick{stroke:var(--faint); stroke-width:1.25;}   /* match the horizontal gridlines */
  .hour-label, .win-label{
    fill:var(--ink);
    font-size:12.5px;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }
  .win-label{font-size:12px;}
  .area{fill:url(#areaGrad);}
  .curve{
    fill:none; stroke:var(--blue); stroke-width:2.5;
    stroke-linejoin:round; stroke-linecap:round;
    filter:url(#glow);
  }
  .node{fill:var(--bg); stroke:var(--blue); stroke-width:1.75;}
  .node-today{fill:var(--blue-soft); stroke:none; filter:url(#glow);}

  /* ---- the still middle: the bottom third holds the control ---- */
  .middle{
    flex:0 0 33.333%;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
  }
  .hint{
    font-family: ui-serif, Georgia, serif;
    font-size:14px; color:var(--muted);
    opacity:.0; transition:opacity .6s ease;
    text-align:center; max-width:240px; line-height:1.5;
    font-style:italic;
  }
  .hint.show{opacity:.7;}

  /* ---- the control ---- */
  .control{
    appearance:none; border:none; cursor:pointer;
    width:164px; height:164px; border-radius:50%;
    background:transparent;
    color:var(--ink);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size:22px; letter-spacing:.04em;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    transition:transform .25s ease;
  }
  .control:active{transform:scale(.97);}
  .ring{
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid var(--blue-dim);
    box-shadow:0 0 22px -10px var(--glow), inset 0 0 26px -16px var(--glow);
    transition:border-color .5s ease, box-shadow .5s ease;
  }
  .control.running .ring{
    border-color:var(--orange);
    box-shadow:0 0 24px -8px var(--glow-orange), inset 0 0 28px -16px var(--glow-orange);
  }
  .control .label{position:relative; z-index:1;}
  .control:focus-visible{outline:2px solid var(--blue); outline-offset:6px;}

  /* ---- quiet utility row ---- */
  .util{
    display:flex; justify-content:center; gap:26px;
    padding-top:14px; min-height:18px;
  }
  .util button{
    appearance:none; background:none; border:none; cursor:pointer;
    color:var(--muted); opacity:.5;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11px; letter-spacing:.06em;
    padding:4px 2px;
    transition:opacity .2s, color .2s;
  }
  .util button:hover{opacity:.9;}
  .util button.arm{color:var(--blue); opacity:.9;}
  .util.hidden{visibility:hidden;}

  /* ---- the "long sit" decision overlay (forgotten Finish) ---- */
  .phantom{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:34px 28px;
    background:rgba(8,10,14,0.88);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    opacity:0; transition:opacity .35s ease;
  }
  .phantom[hidden]{display:none;}
  .phantom.show{opacity:1;}
  .phantom-card{
    width:100%; max-width:340px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:24px;
  }
  .phantom-text, .phantom-sub{
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size:20px; line-height:1.5; color:var(--ink); margin:0;
  }
  .phantom-sub{ margin-top:16px; }   /* extra breathing room above the alt option */
  .pbtn{
    appearance:none; cursor:pointer; width:100%;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size:18px; color:var(--ink); background:transparent;
    border:1.5px solid var(--blue-dim); border-radius:40px;
    padding:15px 20px; letter-spacing:.02em;
    transition:border-color .3s ease, box-shadow .3s ease, transform .15s ease;
  }
  .pbtn:active{transform:scale(.98);}
  .pbtn-primary{ border-color:var(--blue); box-shadow:0 0 26px -10px var(--glow); }
  .pbtn:focus-visible{outline:2px solid var(--blue); outline-offset:4px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="chart-wrap">
    <div class="chart-head">
      <span class="head-label">Hours a day</span>
      <span class="head-label">Last 5 days</span>
    </div>
    <svg class="chart" viewBox="0 0 360 480" preserveAspectRatio="none" aria-label="Practice curve">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--area-top)"/>
          <stop offset="100%" stop-color="var(--area-bot)"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g id="gridLayer"></g>
      <path id="area" class="area" d=""></path>
      <path id="curve" class="curve" d=""></path>
      <g id="nodeLayer"></g>
      <g id="winLayer"></g>
    </svg>
  </div>

  <div class="middle">
    <button id="control" class="control" aria-label="Begin sitting">
      <span class="ring"></span>
      <span class="label" id="ctrlLabel">Begin</span>
    </button>
    <div id="hint" class="hint">Press begin to start your first sitting.</div>
  </div>

</div>

<div id="phantom" class="phantom" role="dialog" aria-modal="true" aria-label="Record this sit" hidden>
  <div class="phantom-card">
    <p class="phantom-text">Long sit.<br>Did you forget to stop the timer?</p>
    <button id="recActual" class="pbtn pbtn-primary">Record <span id="recActualTime">0m</span></button>
    <p class="phantom-sub">Or use your average time instead.</p>
    <button id="recAvg" class="pbtn pbtn-primary">Record <span id="recAvgTime">0m</span></button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- persistent state (carries across sessions on-device) ----------
  // Held in memory so rendering stays synchronous; written to localStorage on change.
  // Time is timestamp-based, never counter-based: a sit stores its absolute start
  // (Date.now()) and duration is always derived from wall-clock timestamps. This is
  // what keeps a multi-hour sit exact across screen-off, backgrounding, or app eviction.
  var K_STATE = "mt_state";
  // sessions:[{s:ms,e:ms}], active:startMs|null
  // savedAvg5d: the 5-day average (h/day) snapshotted when the current sit began,
  //   so the "forgot to finish" check is never contaminated by the in-progress sit.
  // pending: a frozen, undecided long sit awaiting the user's Record choice
  //   ({start,end,baseline}) — survives reload so the choice can't be skipped.
  var state = { sessions: [], active: null, savedAvg5d: null, pending: null };
  var ready = false;

  async function loadState(){
    try{
      var raw = localStorage.getItem(K_STATE);
      if(raw){
        var p = JSON.parse(raw);
        state.sessions = Array.isArray(p.sessions) ? p.sessions : [];
        state.active = (typeof p.active === "number") ? p.active : null;
        state.savedAvg5d = (typeof p.savedAvg5d === "number") ? p.savedAvg5d : null;
        state.pending = (p.pending && typeof p.pending === "object") ? p.pending : null;
      }
    }catch(e){
      // key absent or unreadable -> fresh state
      state.sessions = []; state.active = null; state.savedAvg5d = null; state.pending = null;
    }
  }

  function saveState(){
    // best effort; UI does not block on the write
    try{
      localStorage.setItem(K_STATE, JSON.stringify({
        sessions: state.sessions, active: state.active,
        savedAvg5d: state.savedAvg5d, pending: state.pending
      }));
    }catch(e){ /* storage full / unavailable -> best effort */ }
  }

  // ---------- the windows: avg hours/day over trailing N days ----------
  // TOP (the vertical axis maximum, in hours) is not fixed: it adapts to the data
  // so a few-minutes-a-day sitter and a several-hours-a-day sitter both get a
  // readable curve. See computeTop().
  var HOUR = 3600000, DAY = 86400000, TOP = 1, NWIN = 5;

  function computeWindows(now){
    var all = state.active ? state.sessions.concat([{s:state.active, e:now}]) : state.sessions;
    var vals = [];                       // vals[0] = N=1 (today), vals[4] = N=5
    for(var N=1; N<=NWIN; N++){
      var cutoff = now - N*DAY, sum = 0;
      for(var i=0;i<all.length;i++){
        var a = Math.max(all[i].s, cutoff);
        var b = Math.min(all[i].e, now);
        if(b>a) sum += (b-a);
      }
      vals.push((sum/HOUR)/N);           // hours per day
    }
    return vals;
  }

  // The axis maximum, in whole hours: start at 1h, and step up by one whole hour
  // as soon as ANY of the five averages meets or exceeds the current top. So the
  // top is floor(maxAverage)+1 (min 1) — always leaving the curve some headroom.
  // (The tiny epsilon makes a value that is exactly an hour count as "reaching" it.)
  function computeTop(vals){
    var m = 0;
    for(var i=0;i<vals.length;i++){ if(vals[i] > m) m = vals[i]; }
    return Math.max(1, Math.floor(m + 1e-9) + 1);
  }

  // We only need the trailing five-day window (the longest average the chart draws),
  // and only to the nearest minute. So times are recorded rounded to the minute, and
  // any session that ended more than five days ago is dropped — it can no longer
  // affect any of the five averages.
  var MIN = 60000;
  function roundMin(t){ return Math.round(t/MIN)*MIN; }

  // The 5-day average (hours/day) from stored sessions only — never the in-progress
  // sit. Used as a fallback baseline when no snapshot was saved at begin().
  function cleanFiveDay(now){
    var cutoff = now - NWIN*DAY, sum = 0;
    for(var i=0;i<state.sessions.length;i++){
      var a = Math.max(state.sessions[i].s, cutoff);
      var b = Math.min(state.sessions[i].e, now);
      if(b>a) sum += (b-a);
    }
    return (sum/HOUR)/NWIN;
  }

  function pruneOld(now){
    var cutoff = now - NWIN*DAY;
    var n = state.sessions.length;
    state.sessions = state.sessions.filter(function(x){ return x.e > cutoff; });
    if(state.sessions.length !== n) saveState();
  }

  // ---------- chart geometry (responsive) ----------
  // The chart fills the top two-thirds of the screen and the control sits in the
  // bottom third, so the plot's aspect ratio adapts to each phone. Geometry is
  // measured from the SVG's real pixel size and the viewBox is kept 1:1 with those
  // pixels, so strokes and labels stay crisp and undistorted at any size.
  var svgEl = document.querySelector("svg.chart");
  var W=360, H=480, padL=28, padR=14, padT=12, padB=30;
  var plotW, plotH;
  function recalc(){ plotW = W-padL-padR; plotH = H-padT-padB; }
  recalc();
  function xAt(i){ return padL + plotW*(i/(NWIN-1)); }        // 0=left(5d) .. 4=right(today)
  function yAt(h){ var c=Math.max(0,Math.min(TOP,h)); return padT + plotH*(1 - c/TOP); }

  // grid + axis labels, rebuilt whenever the chart is (re)sized
  var gridLayer = document.getElementById("gridLayer");
  var winLayer  = document.getElementById("winLayer");
  function buildGrid(){
    gridLayer.innerHTML = "";
    for(var h=0; h<=TOP; h++){
      var y = yAt(h);
      var line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1", padL); line.setAttribute("x2", W-padR);
      line.setAttribute("y1", y); line.setAttribute("y2", y);
      line.setAttribute("class", h===0 ? "grid-base":"grid-line");
      gridLayer.appendChild(line);
      if(h>0){
        var t = document.createElementNS("http://www.w3.org/2000/svg","text");
        t.setAttribute("x", padL-7); t.setAttribute("y", y+3.5);
        t.setAttribute("text-anchor","end"); t.setAttribute("class","hour-label");
        t.textContent = h;
        gridLayer.appendChild(t);
      }
    }
    // 10-minute tick marks on the right edge, kept at every 10 minutes for every
    // hour no matter how tall the axis grows (the half-hour tick is a touch longer)
    for(var hh=0; hh<TOP; hh++){
      for(var m=1; m<=5; m++){
        var ty = yAt(hh + m/6);                  // :10 :20 :30 :40 :50 within each hour
        var len = (m===3) ? 11 : 7;
        var tick = document.createElementNS("http://www.w3.org/2000/svg","line");
        tick.setAttribute("x1", W-padR-len); tick.setAttribute("x2", W-padR);
        tick.setAttribute("y1", ty); tick.setAttribute("y2", ty);
        tick.setAttribute("class","tick");
        gridLayer.appendChild(tick);
      }
    }
    var labels = ["5d","4d","3d","2d","1d"];  // left -> right
    winLayer.innerHTML = "";
    for(var i=0;i<NWIN;i++){
      var t2 = document.createElementNS("http://www.w3.org/2000/svg","text");
      t2.setAttribute("x", xAt(i)); t2.setAttribute("y", H-12);
      t2.setAttribute("text-anchor","middle"); t2.setAttribute("class","win-label");
      t2.textContent = labels[i];
      winLayer.appendChild(t2);
    }
  }

  // measure the SVG box, sync the viewBox to it (1:1 px), rebuild grid, redraw
  function layout(){
    var r = svgEl.getBoundingClientRect();
    if(r.width < 2 || r.height < 2) return;
    W = Math.round(r.width); H = Math.round(r.height);
    recalc();
    svgEl.setAttribute("viewBox", "0 0 "+W+" "+H);
    buildGrid();
    drawVals(disp);
  }

  function smoothPath(pts){
    if(pts.length<2) return "";
    var d = "M "+pts[0].x+" "+pts[0].y;
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      var c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
      var c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
      d += " C "+c1x+" "+c1y+", "+c2x+" "+c2y+", "+p2.x+" "+p2.y;
    }
    return d;
  }

  var curveEl = document.getElementById("curve");
  var areaEl  = document.getElementById("area");
  var nodeLayer = document.getElementById("nodeLayer");

  function drawVals(vals){
    // vals[0]=today(N1) .. vals[4]=5d(N5); plot left->right as 5d..today
    var pts = [];
    for(var i=0;i<NWIN;i++){
      var v = vals[NWIN-1-i];   // i=0 -> vals[4](5d) ... i=4 -> vals[0](today)
      pts.push({x:xAt(i), y:yAt(v)});
    }
    var line = smoothPath(pts);
    curveEl.setAttribute("d", line);
    areaEl.setAttribute("d", line+" L "+pts[NWIN-1].x+" "+yAt(0)+" L "+pts[0].x+" "+yAt(0)+" Z");

    nodeLayer.innerHTML = "";
    for(var j=0;j<NWIN;j++){
      var isToday = (j===NWIN-1);
      var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx", pts[j].x); c.setAttribute("cy", pts[j].y);
      c.setAttribute("r", isToday ? 4.5 : 3);
      c.setAttribute("class", isToday ? "node node-today" : "node");
      nodeLayer.appendChild(c);
    }
  }

  // ---------- animated rendering ----------
  var disp = [0,0,0,0,0];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function render(animate){
    var target = computeWindows(Date.now());
    var newTop = computeTop(target);             // adapt the vertical scale to the data
    if(newTop !== TOP){ TOP = newTop; buildGrid(); }
    if(!animate || reduce){ disp = target.slice(); drawVals(disp); return; }
    var from = disp.slice(), start = performance.now(), dur = 650;
    function step(t){
      var k = Math.min(1, (t-start)/dur);
      var e = 1-Math.pow(1-k,3);            // easeOutCubic
      for(var i=0;i<NWIN;i++) disp[i] = from[i] + (target[i]-from[i])*e;
      drawVals(disp);
      if(k<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- control / session ----------
  var control = document.getElementById("control");
  var ctrlLabel = document.getElementById("ctrlLabel");
  var hint = document.getElementById("hint");

  function running(){ return state.active != null; }

  // a soft click for button presses — synthesized with Web Audio so there is no
  // asset to cache; the context is created/resumed inside the user gesture (iOS)
  var actx = null;
  function playClick(){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
      var t = actx.currentTime;
      var osc = actx.createOscillator(), g = actx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(620, t);
      osc.frequency.exponentialRampToValueAtTime(320, t + 0.05);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.004);  // quick soft attack
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06); // short decay
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + 0.07);
    }catch(e){ /* audio unavailable -> stay silent */ }
  }

  function reflectState(){
    var run = running();
    control.classList.toggle("running", run);
    ctrlLabel.textContent = run ? "Finish" : "Begin";
    control.setAttribute("aria-label", run ? "Finish sitting" : "Begin sitting");
    var empty = state.sessions.length===0 && !run;
    hint.classList.toggle("show", empty);
  }

  function begin(){
    var now = Date.now();
    // snapshot the 5-day average before this sit exists, so the long-sit check and
    // the "log your average" offer are never inflated by the sit in progress
    state.savedAvg5d = computeWindows(now)[NWIN-1];
    state.active = now;
    saveState();                 // persist start immediately: survives eviction mid-sit
    reflectState(); render(true); pace();
  }
  function finish(){
    if(state.active == null){ reflectState(); render(true); pace(); return; }
    var now = Date.now(), startMs = state.active;
    var elapsedH = (now - startMs)/HOUR;
    var baseline = (typeof state.savedAvg5d === "number") ? state.savedAvg5d : cleanFiveDay(now);

    // A likely forgotten Finish: longer than an hour AND more than twice the usual.
    // Don't record yet — freeze it and let the user decide (survives reload).
    if(elapsedH > 1 && elapsedH > 2*baseline){
      state.pending = { start: startMs, end: now, baseline: baseline };
      state.active = null;
      saveState();
      if(timer) clearInterval(timer);
      reflectState();
      showPhantom();
      return;
    }

    state.sessions.push({ s: roundMin(startMs), e: roundMin(now) });
    state.active = null;
    saveState();
    pruneOld(now);
    reflectState(); render(true); pace();
  }
  control.addEventListener("click", function(){
    if(!ready || state.pending) return;     // a pending choice blocks the control
    playClick();                            // soft click on Begin and Finish
    running() ? finish() : begin();
  });

  // ---------- the "long sit" decision (forgotten Finish) ----------
  var phantom    = document.getElementById("phantom");
  var recActual  = document.getElementById("recActual");
  var recAvg     = document.getElementById("recAvg");
  var recActualT = document.getElementById("recActualTime");
  var recAvgT    = document.getElementById("recAvgTime");

  function fmtDur(mins){
    mins = Math.max(0, Math.round(mins));
    var h = Math.floor(mins/60), m = mins%60;
    if(h>0 && m>0) return h+"h "+m+"m";
    if(h>0) return h+"h";
    return m+"m";
  }

  function showPhantom(){
    var p = state.pending; if(!p) return;
    var actualMin = (p.end - p.start)/MIN;
    var avgMin = p.baseline*60;
    recActualT.textContent = fmtDur(actualMin);
    recAvgT.textContent = fmtDur(avgMin);
    recActual.setAttribute("aria-label", "Record the actual time, "+fmtDur(actualMin));
    recAvg.setAttribute("aria-label", "Record your average time, "+fmtDur(avgMin));
    phantom.hidden = false;
    requestAnimationFrame(function(){ phantom.classList.add("show"); });
  }
  function hidePhantom(){
    phantom.classList.remove("show");
    setTimeout(function(){ phantom.hidden = true; }, 350);
  }
  function resolvePhantom(useAverage){
    var p = state.pending; if(!p) return;
    var s, e;
    if(useAverage){
      e = roundMin(p.end);
      s = e - Math.round(p.baseline*60)*MIN;     // a session as long as the saved average
    }else{
      s = roundMin(p.start); e = roundMin(p.end); // the real, full time
    }
    if(e > s) state.sessions.push({ s:s, e:e });  // (avg of ~0 records nothing)
    state.pending = null;
    saveState();
    pruneOld(Date.now());
    hidePhantom();
    reflectState(); render(true); pace();
  }
  recActual.addEventListener("click", function(){ resolvePhantom(false); });
  recAvg.addEventListener("click", function(){ resolvePhantom(true); });

  // ---------- live decay ticking ----------
  // Note: this interval only triggers re-renders; it never accumulates elapsed time.
  // If it is throttled or paused while backgrounded, recorded duration is unaffected.
  var timer = null;
  function pace(){
    if(timer) clearInterval(timer);
    timer = setInterval(function(){ render(true); }, running() ? 5000 : 30000);
  }

  // ---------- boot ----------
  (async function(){
    await loadState();
    pruneOld(Date.now());   // drop anything older than the five-day window
    ready = true;
    reflectState();
    layout();          // measure the box and build the grid for this screen
    render(false);
    pace();
    if(state.pending) showPhantom();   // an undecided long sit is waiting
  })();

  // re-measure when the viewport changes (rotation, resize, dynamic toolbars)
  function relayout(){
    requestAnimationFrame(function(){ layout(); render(true); });
  }
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", function(){ setTimeout(relayout, 80); });

  // recompute whenever the app is seen again, so the chart reflects real elapsed
  // wall-clock time after a screen-off / backgrounded / bfcache-restored sit.
  function resume(){
    if(ready){
      pruneOld(Date.now()); reflectState(); layout(); render(true); pace();
      if(state.pending) showPhantom();
    }
  }
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) resume();
  });
  window.addEventListener("pageshow", resume);   // incl. back-forward cache restores
  window.addEventListener("focus", resume);
})();

// ---------- PWA: register the service worker (offline + installable) ----------
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* offline support is best-effort */ });
  });
}
</script>
